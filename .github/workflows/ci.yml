name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long_for_tests
      DB_FILE: ./test_bible_quiz.db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  backup-verify:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      JWT_SECRET: ci_test_secret_at_least_32_characters_long_for_tests
      DB_FILE: ./ci_bible_quiz.db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Seed admin + questions
        run: npm run seed

      - name: Create backup
        run: npm run backup

      - name: Verify backup
        run: |
          BACKUP=$(ls -t backups/*.db | head -1)
          npm run verify-backup -- "$BACKUP"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup
          path: backend/backups/
          retention-days: 7